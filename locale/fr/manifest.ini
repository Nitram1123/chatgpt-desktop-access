description = "Améliore l’accessibilité de l’application ChatGPT pour Windows avec NVDA. L’extension annonce l’activité par la parole, le braille et les sons. Elle facilite la navigation entre les chats, les commandes vocales et la gestion du focus dans ChatGPT et Codex."
changelog = """* La saisie de / ou @ dans la zone de message annonce le menu de suggestions et l’option en surbrillance.
* NVDA+Alt+W annonce le mode Chat ou Work de la zone de message. Appuyez deux fois rapidement pour changer de mode.
* NVDA+Alt+A annonce les fichiers et outils joints au message, comme la recherche web.
* Le son de travail ne se déclenche plus au repos quand un titre de chat ressemble à une annonce d’activité de Codex.
* Lors de la création d’un projet Codex, le focus reste dans le champ du nom pendant la saisie.
* Après chaque mise à jour de ChatGPT, l’extension vérifie les contrôles dont elle dépend et indique la version de ChatGPT dans le rapport d’assistance."""
